<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Supermarket</title>
<style>
:root{--green:#187747;--mint:#e7f5eb;--ink:#17251e;--muted:#6c7b72;--line:#dfe8e1;--paper:#fff;--bg:#f2f6f2;--gold:#f2c75c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;font-weight:750;transition:.15s}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--green);color:white}.secondary{background:var(--mint);color:var(--green);border:1px solid #c5e5ce}.dark{background:#17372a;color:white}.wrap{max-width:1100px;margin:auto;padding:14px}.top{background:#16372a;color:white;padding:18px 0}.topinner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:clamp(20px,4vw,29px);font-weight:900}.eyebrow{font-size:11px;color:#9de5b7;letter-spacing:2px;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#ffffff12;border:1px solid #ffffff18;padding:9px 12px;border-radius:12px;min-width:100px}.stat small{display:block;color:#c9d9ce;font-size:11px}.stat b{font-size:18px}.green{color:#a5f0ba}.layout{display:grid;grid-template-columns:210px 1fr;gap:14px;margin-top:14px}.sidebar,.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px #193b2410}.sidebar{padding:10px;height:max-content;position:sticky;top:12px}.nav{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;color:#506057}.nav.active{background:var(--mint);color:var(--green)}.content{min-width:0}.notice{padding:12px 14px;background:#17372a;color:white;border-radius:12px;margin-bottom:12px;font-size:13px}.card{padding:16px;margin-bottom:12px}.head{font-size:22px;font-weight:900;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mini{background:#f3f8f4;border-radius:12px;padding:12px}.mini small{display:block;color:var(--muted);font-size:11px}.mini b{font-size:20px}.scene{min-height:230px;border-radius:14px;padding:15px;overflow:hidden;border:1px solid #cbd7c9;background:linear-gradient(135deg,#e7d7b8,#f8f1e2 55%,#d5e5d5);position:relative}.scene.wood{background:linear-gradient(135deg,#ad7c4e,#efd0a3)}.scene.marble{background:linear-gradient(135deg,#d6dfe5,#fff)}.scene.concrete{background:linear-gradient(135deg,#aeb8b3,#e6e7e1)}.store-sign{display:inline-block;background:#fff;color:#1b4831;border-radius:8px;padding:8px 11px;font-weight:900;box-shadow:0 2px 7px #0001}.shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.shelf{background:#9d6b41;border:4px solid #80502f;border-bottom-width:7px;border-radius:5px;min-height:65px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:5px;box-shadow:0 4px 0 #7c4d2c}.shelf span{font-size:22px;background:#fff7df;border-radius:4px;padding:3px}.floorline{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #edf1ed}.item:last-child{border-bottom:0}.emoji{width:46px;height:46px;flex-shrink:0;display:grid;place-items:center;background:#f1f6f1;border-radius:12px;font-size:26px}.itembody{flex:1;min-width:0}.itemname{font-weight:800;font-size:14px}.muted{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}.qty{padding:6px 9px;border:1px solid var(--line);background:white;border-radius:8px}.progress{height:7px;background:#e7eee8;border-radius:10px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:#24a15a}.pill{display:inline-block;background:var(--mint);color:var(--green);border-radius:30px;padding:4px 8px;font-size:11px;font-weight:800}.input{width:100%;border:1px solid #cbd8ce;border-radius:10px;padding:12px;margin-top:5px;background:white}.receipt{background:#f7faf7;border:1px dashed #b8c7bb;border-radius:12px;padding:13px}.receiptrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #e4ebe5;font-size:13px}.receiptrow:last-child{border:0}.footer{text-align:center;color:#8b9a90;font-size:11px;padding:8px}.twoBtns{display:flex;gap:8px;flex-wrap:wrap}.twoBtns button{flex:1}.toast{color:#a34d11;background:#fff4dc;padding:10px;border-radius:10px;font-size:12px;margin-top:9px}.hidden{display:none!important}
@media(max-width:700px){.wrap{padding:9px}.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px;padding:6px}.nav{min-width:95px;text-align:center;font-size:12px;padding:10px 6px}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:13px}.scene{min-height:210px}.shelves{gap:6px}.shelf{min-height:52px}.shelf span{font-size:18px}.stat{min-width:88px}.stat b{font-size:16px}}
</style>
</head>
<body>
<header class="top"><div class="wrap topinner"><div><div class="eyebrow">YOUR BUSINESS EMPIRE</div><div class="brand">🛒 My Supermarket</div><div style="font-size:12px;color:#c9d9ce">Buy smart. Stock shelves. Grow big.</div></div><div class="stats"><div class="stat"><small>Cash</small><b class="green" id="cashTop">₹5,000</b></div><div class="stat"><small>Level</small><b id="levelTop">⭐ 1</b></div><div class="stat"><small>Customers served</small><b id="servedTop">0</b></div></div></div></header>
<div class="wrap"><div class="layout"><aside class="sidebar" id="nav"></aside><main class="content"><div id="notice" class="notice">Welcome, boss! Your supermarket is ready. Order stock, refill shelves, and serve your first customer.</div><div id="main"></div><div class="footer">MY SUPERMARKET · Owner mode · All prices in ₹</div></main></div></div>
<script>
const products=[
{id:'milk',name:'Milk',icon:'🥛',cat:'Groceries',cost:24,price:35,stock:8,cap:24,level:1},
{id:'bread',name:'Bread',icon:'🍞',cat:'Groceries',cost:20,price:30,stock:7,cap:24,level:1},
{id:'eggs',name:'Eggs',icon:'🥚',cat:'Groceries',cost:35,price:48,stock:6,cap:24,level:1},
{id:'rice',name:'Rice',icon:'🍚',cat:'Groceries',cost:48,price:65,stock:5,cap:24,level:1},
{id:'chips',name:'Chips',icon:'🍟',cat:'Snacks',cost:12,price:20,stock:5,cap:20,level:1},
{id:'cola',name:'Cola',icon:'🥤',cat:'Beverages',cost:18,price:30,stock:4,cap:20,level:1},
{id:'soap',name:'Soap',icon:'🧼',cat:'Household',cost:22,price:35,stock:0,cap:20,level:2},
{id:'detergent',name:'Detergent',icon:'🫧',cat:'Household',cost:65,price:90,stock:0,cap:20,level:2},
{id:'shirt',name:'T-shirt',icon:'👕',cat:'Clothing',cost:180,price:299,stock:0,cap:18,level:3},
{id:'jeans',name:'Jeans',icon:'👖',cat:'Clothing',cost:350,price:549,stock:0,cap:18,level:3},
{id:'lipstick',name:'Lipstick',icon:'💄',cat:'Cosmetics',cost:120,price:220,stock:0,cap:18,level:4},
{id:'cream',name:'Face cream',icon:'🧴',cat:'Cosmetics',cost:160,price:280,stock:0,cap:18,level:4},
{id:'toy',name:'Teddy bear',icon:'🧸',cat:'Toys',cost:250,price:399,stock:0,cap:18,level:5},
{id:'headphones',name:'Headphones',icon:'🎧',cat:'Electronics',cost:650,price:899,stock:0,cap:12,level:6}
];
const departments=[
{name:'Groceries',level:1,cost:0,icon:'🥬'},{name:'Snacks',level:1,cost:0,icon:'🍟'},{name:'Beverages',level:1,cost:0,icon:'🥤'},
{name:'Household',level:2,cost:1200,icon:'🧼'},{name:'Clothing',level:3,cost:3500,icon:'👕'},{name:'Cosmetics',level:4,cost:6000,icon:'💄'},{name:'Toys',level:5,cost:10000,icon:'🧸'},{name:'Electronics',level:6,cost:16000,icon:'🎧'}
];
const flooring=[{name:'Classic tiles',cost:0,cls:''},{name:'Warm wood',cost:500,cls:'wood'},{name:'White marble',cost:900,cls:'marble'},{name:'Modern concrete',cost:700,cls:'concrete'}];
let state={cash:5000,level:1,served:0,sales:0,profit:0,day:1,staff:0,helperCost:150,orders:0,decor:false,floor:'Classic tiles',unlocked:['Groceries','Snacks','Beverages'],page:'store',cart:[],received:'',storeName:'My Supermarket',reputation:0};
let quantities={};
const $=id=>document.getElementById(id), money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
function notice(s){$('notice').textContent=s}
function active(p){return state.unlocked.includes(p.cat)&&p.level<=state.level}
function available(){return products.filter(active)}
function allStock(){return available().reduce((s,p)=>s+p.stock,0)}
function button(text,action,cls='primary',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`}
function nav(){const pages=[['store','🏪','Store'],['orders','📦','Orders'],['stock','🧃','Restock'],['cashier','🧾','Cashier'],['business','📈','Business']];$('nav').innerHTML=pages.map(([id,ic,t])=>`<button class="nav ${state.page===id?'active':''}" data-page="${id}">${ic}<br>${t}</button>`).join('')}
function scene(){let ps=available().filter(p=>p.stock>0).slice(0,9),f=flooring.find(x=>x.name===state.floor)||flooring[0];return `<div class="scene ${f.cls}"><div class="store-sign">🛒 ${state.storeName}</div><span class="pill" style="float:right">● OPEN</span><div class="shelves">${[0,1,2].map(i=>`<div class="shelf">${ps.slice(i*3,i*3+3).map(p=>`<span title="${p.name}">${p.icon}</span>`).join('')||'<span>📦</span>'}</div>`).join('')}</div><div class="floorline"><span>${state.decor?'🪴 Plants & decor':'🏬 Your store floor'}</span><span>🧾 CHECKOUT</span></div></div>`}
function item(p,mode){let detail=mode==='order'?`<div class="muted">Wholesale ${money(p.cost)} · Sell ${money(p.price)}</div>`:mode==='stock'?`<div class="progress"><span style="width:${Math.min(100,p.stock/p.cap*100)}%"></span></div><div class="muted">${p.stock}/${p.cap} units</div>`:`<div class="muted">${money(p.price)} each · ${p.stock} in stock</div>`;let actions='';if(mode==='order')actions=`<div class="actions"><button class="qty" data-action="minus" data-id="${p.id}">−</button><b>${quantities[p.id]??5}</b><button class="qty" data-action="plus" data-id="${p.id}">+</button><button class="primary" data-action="orderone" data-id="${p.id}">Order</button></div>`;if(mode==='stock')actions=button(p.stock>=p.cap?'Full':'Restock','restock',p.stock>=p.cap?'secondary':'primary',`data-id="${p.id}" ${p.stock>=p.cap?'disabled':''}`);return `<div class="item"><div class="emoji">${p.icon}</div><div class="itembody"><div class="itemname">${p.name}</div>${detail}${actions}</div></div>`}
function store(){return `<div class="card"><div class="head">Good day, boss! 👋</div><div class="sub">Welcome to your supermarket. Keep shelves full and customers happy.</div><div style="margin-top:14px">${scene()}</div><div class="twoBtns" style="margin-top:10px">${button('🛒 Serve next customer','customer')}${button('🎨 Design store','design','secondary')}</div></div><div class="grid3"><div class="mini"><small>Today's sales</small><b>${money(state.sales)}</b></div><div class="mini"><small>Stock units</small><b>${allStock()}</b></div><div class="mini"><small>Daily wages</small><b>${money(state.staff*state.helperCost)}</b></div></div><div class="card"><div class="head" style="font-size:17px">Shelf health</div>${available().slice(0,6).map(p=>`<div style="padding:8px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${p.icon} ${p.name}</b><span>${p.stock}/${p.cap}</span></div><div class="progress"><span style="width:${p.stock/p.cap*100}%"></span></div></div>`).join('')}${button('Manage stock →','page','secondary','data-page="stock"')}</div>`}
function orders(){return `<div class="card"><div class="head">Order products 📦</div><div class="sub">Choose quantities and pay wholesale prices. Deliveries arrive immediately in this prototype.</div><div style="margin-top:12px"><span class="pill">SUPPLIER CATALOGUE</span></div>${products.filter(p=>p.level<=state.level&&state.unlocked.includes(p.cat)).map(p=>item(p,'order')).join('')}<div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;font-weight:850"><span>Selected order</span><span>${money(products.filter(p=>active(p)).reduce((s,p)=>s+(quantities[p.id]??5)*p.cost,0))}</span></div><div style="margin-top:12px">${button('🚚 Place selected orders','placeorders')}</div></div><div class="card"><b>Owner-only responsibility</b><div class="sub">You must order products yourself. Employees cannot contact suppliers or operate the cashier.</div></div>`}
function stock(){return `<div class="card"><div class="head">Restock shelves 🧃</div><div class="sub">Move products from your backroom inventory onto the shop floor.</div>${available().map(p=>item(p,'stock')).join('')}<div class="sub" style="margin-top:12px">No stock left? Go to Orders and purchase more first.</div></div>${state.staff?`<div class="card"><div class="head" style="font-size:17px">Your helpers 👥</div><div class="sub">${state.staff} helper(s) can refill available products for you.</div><div style="margin-top:12px">${button('Ask helpers to restock','helpers','secondary')}</div></div>`:''}`}
function cashier(){let total=state.cart.reduce((s,x)=>s+x.price,0);return `<div class="card"><div class="head">Owner-operated checkout 🧾</div><div class="sub">Scan every item, collect payment and give the correct change. This job always stays yours.</div><div style="background:#16372a;color:white;padding:15px;border-radius:12px;margin-top:13px"><div class="eyebrow">TOTAL DUE</div><div style="font-size:30px;font-weight:900">${money(total)}</div><div style="font-size:12px;color:#d0e1d5">${state.cart.length} item(s) scanned</div></div><h3 style="font-size:14px;margin-bottom:0">Scan products</h3>${available().filter(p=>p.stock>0).map(p=>`<button class="item" style="width:100%;text-align:left;background:white" data-action="scan" data-id="${p.id}"><div class="emoji">${p.icon}</div><div class="itembody"><div class="itemname">${p.name}</div><div class="muted">${money(p.price)} · ${p.stock} in stock</div></div><span class="pill">SCAN +</span></button>`).join('')||'<p class="sub">No products in stock. Order and restock goods first.</p>'}</div><div class="card"><div class="head" style="font-size:17px">Customer receipt</div><div class="receipt">${state.cart.length?state.cart.map((x,i)=>`<div class="receiptrow"><span>${x.icon} ${x.name}</span><span>${money(x.price)} <button class="secondary" style="padding:3px 7px" data-action="unscan" data-index="${i}">×</button></span></div>`).join(''):'<div class="sub">Scan a product to begin the sale.</div>'}<div class="receiptrow" style="font-weight:900;font-size:16px"><span>TOTAL</span><span>${money(total)}</span></div></div><label style="display:block;font-weight:800;font-size:12px;margin-top:13px">Cash received (₹)</label><input class="input" id="received" type="number" min="0" placeholder="Enter amount customer pays" value="${state.received}"><div class="actions">${[100,200,500,1000].map(n=>`<button class="secondary" data-action="cash" data-value="${n}">₹${n}</button>`).join('')}</div><div class="mini" style="margin-top:12px"><small>CHANGE TO GIVE BACK</small><b class="green" id="change">${state.received!==''&&Number(state.received)>=total?money(Number(state.received)-total):'—'}</b></div><div style="margin-top:12px">${button('✓ Complete sale','complete')}</div></div>`}
function business(){return `<div class="card"><div class="head">Grow your business 📈</div><div class="sub">Invest your profits in people, departments and store upgrades.</div></div><div class="card"><div class="head" style="font-size:18px">👥 Staff & helpers</div><div class="sub">Helpers restock available inventory. You still order every product and operate checkout.</div><div class="grid" style="margin-top:12px"><div class="mini"><small>Helpers hired</small><b>${state.staff}</b></div><div class="mini"><small>Wages per day</small><b>${money(state.staff*state.helperCost)}</b></div></div><div style="margin-top:12px">${button('Hire helper · '+money(state.helperCost),'hire')}</div><div class="sub">Maximum 4 helpers in this version.</div></div><div class="card"><div class="head" style="font-size:18px">🔓 Departments</div>${departments.map(d=>{let open=state.unlocked.includes(d.name);return `<div class="item"><div class="emoji">${d.icon}</div><div class="itembody"><div class="itemname">${d.name}</div><div class="muted">${open?'Department unlocked':`Requires level ${d.level} · ${money(d.cost)}`}</div></div>${open?'<span class="pill">OPEN</span>':button('Unlock','unlock','secondary',`data-cat="${d.name}"`)}</div>`}).join('')}</div><div class="card"><div class="head" style="font-size:18px">🎨 Store design</div><div class="sub">Choose flooring and buy decor to make the supermarket your own.</div><div class="grid" style="margin-top:12px">${flooring.map(f=>`<button class="${state.floor===f.name?'primary':'secondary'}" data-action="floor" data-floor="${f.name}">${f.name}<br><small>${state.floor===f.name?'Selected':f.cost===0?'Free':money(f.cost)}</small></button>`).join('')}</div><div style="margin-top:10px">${button(state.decor?'🪴 Decor installed':'🪴 Buy decor · ₹400','decor','secondary')}</div></div><div class="card"><div class="head" style="font-size:18px">📊 Business report</div><div class="grid"><div class="mini"><small>Lifetime sales</small><b>${money(state.sales)}</b></div><div class="mini"><small>Net earnings</small><b>${money(state.profit)}</b></div><div class="mini"><small>Orders placed</small><b>${state.orders}</b></div><div class="mini"><small>Store level</small><b>⭐ ${state.level}</b></div></div><div style="margin-top:12px">${button('🌙 End day & pay wages','endday')}</div></div>`}
function design(){return `<div class="card"><div class="head">Design your store 🎨</div><div class="sub">Choose a floor style. Buy decor as you grow.</div><div style="margin-top:12px">${scene()}</div><div class="grid" style="margin-top:12px">${flooring.map(f=>`<button class="${state.floor===f.name?'primary':'secondary'}" data-action="floor" data-floor="${f.name}">${f.name}<br><small>${state.floor===f.name?'Selected':f.cost===0?'Free':money(f.cost)}</small></button>`).join('')}</div><div style="margin-top:12px">${button(state.decor?'Decor installed':'Buy plants & decor · ₹400','decor','secondary')}</div><div style="margin-top:12px">${button('← Back to store','page','secondary','data-page="store"')}</div></div>`}
function render(){nav();$('cashTop').textContent=money(state.cash);$('levelTop').textContent='⭐ '+state.level;$('servedTop').textContent=state.served;let pages={store,orders,stock,cashier,business,design};$('main').innerHTML=(pages[state.page]||store)()}
function levelCheck(){let n=1+Math.floor(state.served/4);if(n>state.level){state.level=n;notice('🎉 Store level '+n+' reached! New departments are now available to unlock.');}}
function act(a,e){let p=products.find(x=>x.id===e.dataset.id),q;
switch(a){
case'page':state.page=e.dataset.page;break;
case'design':state.page='design';break;
case'plus':quantities[e.dataset.id]=Math.min(50,(quantities[e.dataset.id]??5)+5);break;
case'minus':quantities[e.dataset.id]=Math.max(0,(quantities[e.dataset.id]??5)-5);break;
case'orderone':q=quantities[p.id]??5;if(p.stock+q>p.cap){notice('Storage capacity reached for '+p.name+'. Restock or order less.');break}if(state.cash<q*p.cost){notice('Not enough cash for this order.');break}state.cash-=q*p.cost;state.profit-=q*p.cost;p.stock+=q;state.orders++;notice('Delivery received: '+q+' × '+p.name+'.');break;
case'placeorders':{let list=products.filter(p=>active(p)&&(quantities[p.id]??5)>0);let total=list.reduce((s,p)=>s+(quantities[p.id]??5)*p.cost,0);let over=list.find(p=>p.stock+(quantities[p.id]??5)>p.cap);if(!list.length){notice('Choose a quantity above zero first.');break}if(over){notice('Your order would exceed storage capacity for '+over.name+'. Reduce that quantity.');break}if(total>state.cash){notice('Order costs '+money(total)+'. You have '+money(state.cash)+'. Reduce quantities.');break}list.forEach(p=>{let n=quantities[p.id]??5;p.stock+=n;quantities[p.id]=0});state.cash-=total;state.profit-=total;state.orders++;notice('🚚 Order received! Paid '+money(total)+'.');break}
case'restock':if(p.stock<=0){notice('No '+p.name+' in backroom. Order some first.');break}let n=Math.min(6,p.stock,p.cap-p.stock);if(n<=0){notice('Shelves already full.');break}/* Inventory is modeled as stock on hand; refilling transfers it from backroom in later version. */notice('Restocked '+p.name+' shelves.');break;
case'helpers':{let changed=false;available().forEach(p=>{if(p.stock>0&&p.stock<p.cap){p.stock=Math.min(p.cap,p.stock+Math.min(3,p.cap-p.stock));changed=true}});notice(changed?'Helpers have refilled available products.':'Your helpers found no products to refill. Order goods first.');break}
case'customer':{let candidates=available().filter(p=>p.stock>0);if(!candidates.length){notice('Shelves are empty! Order and restock products before serving a customer.');break}state.cart=[];let count=1+Math.floor(Math.random()*3);for(let i=0;i<count;i++){let list=candidates.filter(p=>p.stock>0);if(!list.length)break;let x=list[Math.floor(Math.random()*list.length)];x.stock--;state.cart.push({id:x.id,name:x.name,icon:x.icon,price:x.price,cost:x.cost})}state.received='';state.page='cashier';notice('A customer is at your checkout. Scan items and collect payment yourself.');break}
case'scan':if(!p||p.stock<=0){notice('Out of stock.');break}p.stock--;state.cart.push({id:p.id,name:p.name,icon:p.icon,price:p.price,cost:p.cost});state.received='';break;
case'unscan':{let i=Number(e.dataset.index),x=state.cart.splice(i,1)[0];if(x){let prod=products.find(p=>p.id===x.id);prod.stock++}break}
case'cash':state.received=e.dataset.value;break;
case'complete':{let total=state.cart.reduce((s,x)=>s+x.price,0),received=Number($('received')?.value||0);if(!state.cart.length){notice('Scan at least one item first.');break}if(received<total){notice('Insufficient payment. Total is '+money(total)+'. Enter the cash received.');break}let c=state.cart.reduce((s,x)=>s+x.cost,0),change=received-total;state.cash+=total;state.sales+=total;state.profit+=total-c;state.served++;state.reputation++;state.cart=[];state.received='';levelCheck();if(state.served%4===0){state.cash+=250;state.profit+=250;notice('Sale complete! Change: '+money(change)+'. Milestone bonus: ₹250!')}else notice('Sale complete! You collected '+money(received)+' and gave '+money(change)+' change.');break}
case'hire':if(state.staff>=4){notice('You have reached the 4-helper limit.');break}if(state.cash<state.helperCost){notice('Not enough cash to hire a helper.');break}state.cash-=state.helperCost;state.profit-=state.helperCost;state.staff++;notice('Helper hired! They can restock available products. Daily wages are paid at day-end.');break;
case'unlock':{let d=departments.find(x=>x.name===e.dataset.cat);if(state.unlocked.includes(d.name)){notice('Department already unlocked.');break}if(state.level<d.level){notice('Reach level '+d.level+' first by serving customers.');break}if(state.cash<d.cost){notice('You need '+money(d.cost)+' to unlock '+d.name+'.');break}state.cash-=d.cost;state.profit-=d.cost;state.unlocked.push(d.name);notice('🎉 '+d.name+' unlocked! You can now order its products.');break}
case'floor':{let f=flooring.find(x=>x.name===e.dataset.floor);if(state.floor===f.name){notice('That floor is already installed.');break}if(state.cash<f.cost){notice('You need '+money(f.cost)+' for this flooring.');break}state.cash-=f.cost;state.profit-=f.cost;state.floor=f.name;notice(f.name+' flooring installed!');break}
case'decor':if(state.decor){notice('Decor is already installed.');break}if(state.cash<400){notice('You need ₹400 to buy decor.');break}state.cash-=400;state.profit-=400;state.decor=true;notice('🪴 Decor installed! Your supermarket feels more welcoming.');break;
case'endday':{let wages=state.staff*state.helperCost;if(state.cash<wages){notice('Not enough cash to pay staff wages. Earn more before ending the day.');break}state.cash-=wages;state.profit-=wages;let bonus=100+state.served*10+(state.decor?50:0);state.cash+=bonus;state.profit+=bonus;let report=`Day ${state.day} is complete.\n\nSales today: ${money(state.sales)}\nStaff wages: ${money(wages)}\nReputation bonus: ${money(bonus)}\nNet lifetime earnings: ${money(state.profit)}\n\nKeep ordering products and serving customers to grow your store!`;state.day++;alert(report);notice('Day '+(state.day-1)+' closed. Reputation bonus: '+money(bonus)+'.');break}
}
render()}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){state.page=b.dataset.page;render()}});
$('main').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)act(b.dataset.action,b)});
$('main').addEventListener('input',e=>{if(e.target.id==='received'){state.received=e.target.value;let total=state.cart.reduce((s,x)=>s+x.price,0),r=Number(state.received);let c=$('change');if(c)c.textContent=state.received!==''&&r>=total?money(r-total):'—'}});
try{let saved=localStorage.getItem('mySupermarketSave_v1');if(saved){let d=JSON.parse(saved);state=Object.assign(state,d.state||{});(d.products||[]).forEach(x=>{let p=products.find(y=>y.id===x.id);if(p)p.stock=x.stock});quantities=d.quantities||{};notice('Welcome back, boss! Your saved store was loaded.')}}catch(e){}
const save=document.createElement('button');save.className='secondary';save.textContent='💾 Save game';save.style.margin='0 0 12px';save.onclick=()=>{try{localStorage.setItem('mySupermarketSave_v1',JSON.stringify({state,products:products.map(p=>({id:p.id,stock:p.stock})),quantities}));notice('Game saved on this browser.')}catch(e){notice('Saving is unavailable in this browser mode.')}};$('notice').after(save);
render();
</script>
